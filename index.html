  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1d4ed8;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --line: #e2e8f0;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --surface: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(15,23,42,0.35);
    }

    .header {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: white;
      padding: 32px 28px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 2vw + 1rem, 3rem);
    }

    .header p {
      margin: 0;
      font-size: 1rem;
      opacity: 0.95;
    }

    .content {
      padding: 24px 28px 32px;
    }

    .toolbar {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .search-box {
      flex: 1 1 420px;
      min-width: 240px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--line);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .summary {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-weight: 600;
    }

    .badge {
      background: #dbeafe;
      color: var(--primary-dark);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.9rem;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    thead {
      background: var(--surface);
    }

    th, td {
      text-align: left;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      font-size: 0.95rem;
      color: var(--text);
    }

    tbody tr:hover {
      background: #f8fbff;
    }

    .serial {
      font-weight: 700;
      color: var(--text);
    }

    .link-btn {
      display: inline-block;
      text-decoration: none;
      background: var(--success);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      transition: opacity 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .link-btn:hover {
      opacity: 0.9;
    }

    .link-btn:focus {
      outline: 3px solid rgba(22,163,74,0.2);
    }

    .empty {
      display: none;
      text-align: center;
      padding: 28px 18px;
      color: var(--muted);
      font-size: 1rem;
    }

    @media (max-width: 700px) {
      body { padding: 12px; }
      .content { padding: 16px; }
      .toolbar { align-items: stretch; }
      th, td { padding: 12px 10px; }
    }
  </style>
</head>

    // GitHub Pages URL - All PDFs will be served directly
    const basePath = window.location.pathname.includes('/Lifting-Gears-Third-party-inspection-certificates/')
      ? '/Lifting-Gears-Third-party-inspection-certificates/'
      : '/';

    function pdfFileName(certificateReference) {
      return certificateReference + '.pdf';
    }

    function renderTable(list) {
      const body = document.getElementById('tableBody');
      const empty = document.getElementById('emptyState');
      const resultCount = document.getElementById('resultCount');
      const totalCount = document.getElementById('totalCount');

      totalCount.textContent = certificates.length;
      resultCount.textContent = list.length + (list.length === 1 ? ' result' : ' results');

      if (!list.length) {
        body.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      body.innerHTML = list.map((item, index) => {
        const fileName = pdfFileName(item.certificateFile);
        const url = basePath + fileName;
        return `
          <tr>
            <td>${index + 1}</td>
            <td class="serial">${escapeHtml(item.serialNumber)}</td>
            <td>${escapeHtml(fileName)}</td>
            <td>
              <a class="link-btn" href="${url}" target="_blank" rel="noopener noreferrer">Open in new window</a>
            </td>
          </tr>
        `;
      }).join('');
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function setupSearch() {
      const input = document.getElementById('searchInput');

      input.addEventListener('input', (event) => {
        const query = event.target.value.trim().toLowerCase();
        const filtered = !query
          ? certificates
          : certificates.filter(item =>
              item.serialNumber.toLowerCase().includes(query) ||
              item.certificateFile.toLowerCase().includes(query)
            );

        renderTable(filtered);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderTable(certificates);
      setupSearch();
    });
